name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Backend Pytest Suite
        run: pytest -v

      - name: Run Frontend & Design System Lint
        run: npm run lint
        
      - name: Run Frontend Unit Tests (Vitest)
        run: npm run test
        
      - name: Build Templates & Assets
        run: python scripts/build_templates.py

      - name: Build Frontend Application
        run: npm run build

      - name: Headless BPMN-Moddle Import Verification
        run: node scripts/verify_bpmn_moddle.mjs

            - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End Smoke Test (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
