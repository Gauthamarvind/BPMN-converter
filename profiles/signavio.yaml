# SAP Signavio Process Manager Export Profile
# Assumptions:
# - Signavio requires explicit bpmn:collaboration wrapper even for single-participant processes.
# - Signavio expects conditions both in flow name and conditionExpression for optimal visual display.
# - IDs with standard prefixes (e.g., 'sid-', 'Activity_', 'Gateway_') are best handled.
# - Prefers concise labels (max 80 chars) to prevent multiline clipping in auto-layout.
# - Disallows nested subProcess recursion without explicit expansion bounds.

name: "signavio"
displayName: "SAP Signavio Process Manager"
description: "Optimized for SAP Signavio import, collaboration wrappers, and flow labeling."

forceCollaboration: true
maxLabelLength: 80
conditionLocation: "both"  # Puts condition in both flow name and conditionExpression
idFormatPattern: "^(sid-|Activity_|Gateway_|Event_|Flow_)[a-zA-Z0-9_-]+$"

allowedElementTypes:
  - startEvent
  - endEvent
  - intermediateTimerEvent
  - intermediateMessageEvent
  - task
  - userTask
  - serviceTask
  - manualTask
  - sendTask
  - receiveTask
  - exclusiveGateway
  - parallelGateway
  - inclusiveGateway
  - subProcess
  - callActivity

extensionNamespaces:
  signavio: "http://www.signavio.com"

assumptions:
  - "Signavio requires a bpmn:collaboration element with at least one bpmn:participant."
  - "Signavio displays condition text prominently when placed in the flow name attribute."
  - "Lanes must contain flowNodeRef elements for every element positioned inside them."
  - "BPMN labels must have explicit dc:Bounds to render cleanly upon import."
