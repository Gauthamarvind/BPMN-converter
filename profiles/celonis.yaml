# Celonis Process Designer Export Profile
# Assumptions:
# - Celonis focuses on execution paths, case flows, and activity transitions.
# - Clean simple task nodes and exclusive/parallel gateways are prioritized for process mining comparison.
# - Flow names should clearly reflect the transition or activity outcome.
# - Collaboration wrapper is optional but supported; clean single-pool is standard.
# - Conditions are ideally displayed on the flow name for quick visual validation.

name: "celonis"
shortName: "Celonis"
displayName: "Celonis Process Designer"
description: "Tailored for Celonis process modeling, transition tracking, and conformance checking."

forceCollaboration: true
maxLabelLength: 90
conditionLocation: "both"
idFormatPattern: "^[a-zA-Z_][a-zA-Z0-9_.-]*$"

allowedElementTypes:
  - startEvent
  - endEvent
  - intermediateTimerEvent
  - task
  - userTask
  - serviceTask
  - manualTask
  - exclusiveGateway
  - parallelGateway

extensionNamespaces: {}

assumptions:
  - "Celonis prefers core flow elements (tasks, exclusive gateways, parallel gateways)."
  - "Clear transition labels on sequence flows improve visual alignment with process mining event logs."
  - "Orthogonal edge routing prevents visual overlap during conformance overlay."
