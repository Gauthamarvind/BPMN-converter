# Reverse proxy for Process2BPMN.
#
# Two jobs: terminate TLS, and authenticate the person before the request reaches the app.
# The app runs with APP_AUTH_MODE=proxy and trusts X-Forwarded-User, so this file is the only
# thing standing between the internet and an unauthenticated session — the header must be set
# here and must never be accepted from the client.
#
# Copy to /etc/nginx/sites-available/process2bpmn, adjust the marked values, symlink into
# sites-enabled, then: nginx -t && systemctl reload nginx

# --- rate limiting: a second line of defence behind the app's own RATE_LIMIT_PER_MINUTE ---
limit_req_zone $binary_remote_addr zone=p2b_api:10m rate=60r/m;

upstream process2bpmn {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name process2bpmn.example.com;          # CHANGE ME
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name process2bpmn.example.com;          # CHANGE ME

    # --- TLS ---------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/process2bpmn.example.com/fullchain.pem;   # CHANGE ME
    ssl_certificate_key /etc/letsencrypt/live/process2bpmn.example.com/privkey.pem;     # CHANGE ME
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads: keep this at or above MAX_UPLOAD_SIZE_BYTES or large files fail at the proxy
    # with a 413 the app never sees.
    client_max_body_size 25m;

    # A model call on CPU can take minutes. Without these the proxy gives up before the app
    # answers and the person sees a 504 on a conversion that actually succeeded.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # --- single sign-on ------------------------------------------------------------------
    # Example: oauth2-proxy running on 127.0.0.1:4180 in front of your IdP.
    # Swap in whatever your organisation uses (Authelia, Vouch, an mod_auth_openidc vhost);
    # the only requirement is that it yields a verified identity for $auth_user.
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length   "";
        proxy_pass_request_body           off;
    }

    # --- the app -------------------------------------------------------------------------
    location / {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        error_page 401 = /oauth2/start?rd=$scheme://$host$request_uri;

        # Set the identity header from the verified SSO result, and explicitly clear anything
        # the client sent under the same name. Without the second line anyone could add
        # "X-Forwarded-User: someone-else" and become that person.
        proxy_set_header X-Forwarded-User $auth_user;

        proxy_pass       http://process2bpmn;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /api/ {
        auth_request /oauth2/auth;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;
        error_page 401 = @api_unauthorized;

        limit_req zone=p2b_api burst=20 nodelay;

        proxy_set_header X-Forwarded-User $auth_user;

        proxy_pass       http://process2bpmn;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # An expired session on an API call should be a 401 the SPA can report, not a redirect
    # to a login page that lands inside a fetch().
    location @api_unauthorized {
        default_type application/json;
        return 401 '{"error":"Your session has expired. Reload the page to sign in again.","kind":"AuthError"}';
    }

    # The proxy's own health check. Keep it unauthenticated, and keep
    # EXPOSE_SERVER_CONFIG=false so it cannot leak the model configuration.
    location = /api/health {
        proxy_pass       http://process2bpmn;
        proxy_set_header Host $host;
        access_log off;
    }
}
